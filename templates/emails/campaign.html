<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ site_config.site_name }}</title>
</head>
<body style="margin:0; padding:0; background:#f5f5f7; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif; color:#1d1d1f;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;">
  <tr>
    <td align="center" style="padding:0 0 40px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%;">

        <!-- header -->
        <tr>
          <td style="background:#000000; border-radius:0 0 24px 24px; padding:36px 32px 32px;" align="center">
            <div style="font-size:38px; line-height:1.05; font-weight:700; letter-spacing:-0.035em; color:#ffffff;">
              {{ site_config.site_name }}<span style="color:#ff375f;">.</span>
            </div>
            <div style="font-size:13px; line-height:1.5; color:#a1a1a6; margin-top:10px;">
              {{ site_config.tagline }}
            </div>
          </td>
        </tr>

        <tr><td style="height:28px; line-height:28px; font-size:0;">&nbsp;</td></tr>

        <!-- the email -->
        <tr>
          <td style="padding:0 0 20px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff; border:1px solid #e5e5ea; border-radius:18px;">
              <tr>
                <td style="padding:28px 28px 24px;">
                  {% if first_name %}
                  <p style="font-size:15px; line-height:1.65; margin:0 0 12px; color:#1d1d1f;">{{ first_name }},</p>
                  {% endif %}
                  <div style="font-size:15px; line-height:1.65; margin:0 0 8px; color:#4a4a4f;">
                    {{ body_html }}
                  </div>
                  {% if campaign.link_url %}
                  <a href="{{ campaign.link_url }}" style="display:inline-block; margin-top:10px; background:#000000; color:#ffffff; text-decoration:none; padding:12px 24px; border-radius:999px; font-size:14px; font-weight:500;">{{ campaign.link_label|default:"Book / learn more" }} &rarr;</a>
                  {% endif %}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- footer -->
        <tr>
          <td style="padding:12px 28px 0;" align="center">
            <p style="font-size:12px; line-height:1.6; color:#86868b; margin:0;">
              {{ site_config.site_name }} &mdash; {{ site_config.tagline }}<br>
              <a href="{{ unsubscribe_url }}" style="color:#86868b;">Unsubscribe</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
